server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API routing is owned by the deployment ingress. Keeping this static image
    # free of a localhost or build-time backend URL preserves same-origin APIs.
    location /api/ {
        return 404;
    }
}
